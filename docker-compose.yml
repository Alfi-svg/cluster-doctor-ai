version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: clusterdoctor-postgres
    restart: always

    environment:
      POSTGRES_DB: clusterdoctor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: clusterdoctor-redis
    restart: always

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

  mqtt:
    image: eclipse-mosquitto:2
    container_name: clusterdoctor-mqtt
    restart: always

    ports:
      - "1883:1883"
      - "9001:9001"

    volumes:
      - ./docker/mqtt/config:/mosquitto/config
      - ./docker/mqtt/data:/mosquitto/data
      - ./docker/mqtt/log:/mosquitto/log

  backend:
    build:
      context: ./backend

    container_name: clusterdoctor-backend

    restart: always

    env_file:
      - ./backend/.env

    depends_on:
      - postgres
      - redis
      - mqtt

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend

    container_name: clusterdoctor-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:3000"

    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_WS_URL: ws://backend:8000/ws

volumes:

  postgres_data:

  redis_data: